<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palate Lab · Quick Demo</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#342e3d;background:#faf9f7}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}aside{width:210px;flex:0 0 210px;background:white;border-right:1px solid #ece8ef;padding:30px 18px}aside strong{display:block;font-size:26px;letter-spacing:-.06em;color:#674abd;margin-bottom:55px}aside button{width:100%;text-align:left;border:0;border-radius:10px;background:none;padding:15px;color:#80768e;font-weight:bold;margin-bottom:4px}aside button.active{background:#eee9fb;color:#6848b4}main{flex:1;min-width:0;padding:40px clamp(20px,5vw,80px);max-width:1100px}header{margin-bottom:32px;font-size:12px;letter-spacing:.17em;font-weight:800;color:#9e8dbb}h1{font-size:38px;letter-spacing:-.08em;margin:0 0 11px}p{color:#918b9c;font-size:13px;line-height:1.8}.hero{background:linear-gradient(110deg,#e9e0ff,#ffe6df);padding:38px;border-radius:22px;margin-bottom:35px;position:relative;overflow:hidden}.hero:after{content:'✳';position:absolute;right:30px;top:-10px;color:#b6a1e0;font-size:190px;opacity:.7}.hero p,.hero h1{position:relative;z-index:1}.hero h1 span{color:#674abd}.toolbar{display:flex;align-items:center;gap:8px;margin:25px 0 14px}.toolbar input{flex:1;min-width:0;background:white;border:1px solid #e6dfea;padding:13px 16px;border-radius:10px}.toolbar select,.controls select{border:1px solid #e6dfea;background:#fff;border-radius:10px;padding:12px}.box{background:#fff;border:1px solid #efeaf1;border-radius:15px;overflow:hidden}.item{display:flex;align-items:center;gap:13px;border-bottom:1px solid #f2eef4;padding:12px 15px}.item:last-child{border:0}.em{width:66px;height:63px;display:grid;place-items:center;font-size:32px;background:#f1e7fd;border-radius:11px;flex-shrink:0}.item .desc{flex:1;min-width:0}.desc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;margin-bottom:7px}.desc small{display:block;color:#a69dad;font-size:11px}.ranknum{color:#967ec4;font-weight:bold;min-width:25px}.score{font-size:19px;color:#674abd;font-weight:900;min-width:44px;text-align:center}.item button{border:0;background:#f1ecfb;color:#6b4dba;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:bold}.item button.bookmarked{background:#6b4dba;color:#fff}.item button:disabled{opacity:.4}.muted{font-size:12px;color:#aca5b5}.modal-cover{position:fixed;inset:0;background:#201626aa;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:#fff;border-radius:21px;width:min(100%,600px);padding:32px;box-shadow:0 20px 70px #0003;max-height:90vh;overflow-y:auto}.modal h2{font-size:26px;letter-spacing:-.06em}.modal .head{display:flex;justify-content:space-between;align-items:center}.modal .head button{border:0;background:#f4f0f8;border-radius:50%;height:33px;width:33px}.controls{display:grid;gap:10px}.controls label{font-size:12px;color:#736a7e;font-weight:800}.sentiments{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sentiments button{background:#fff;border:1px solid #e6dfea;border-radius:10px;padding:12px 5px}.sentiments button.active{border-color:#8060c5;background:#f4efff;color:#684ab8}.primary{background:#684bb9;color:white;border:0;padding:13px 20px;border-radius:11px;font-weight:800;margin-top:15px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare button{background:#f8f5ff;border:1px solid #d9d0f2;border-radius:13px;padding:25px 10px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.compare button span{font-size:45px}.compare button b{font-size:13px}.minor-actions{display:flex;justify-content:space-between;margin-top:15px}.minor-actions button{background:none;border:0;color:#7c6b9e;padding:10px}.achievement{text-align:center;background:radial-gradient(#f1e4fc,white 66%);padding:18px}.achievement .cup{font-size:80px}.footnote{font-size:11px;color:#a69eaf;margin-top:20px}.banner{background:#f0ebfb;border-radius:10px;padding:15px;color:#7b65a2;margin-bottom:17px;font-size:12px;line-height:1.8}.stats{display:flex;gap:13px;margin-bottom:20px}.stats div{background:#f1ecfc;padding:16px 20px;border-radius:13px;font-size:13px}.stats b{font-size:29px;color:#674abd;display:block}.empty{padding:40px;text-align:center;color:#a5a0ad}.notice{position:fixed;bottom:18px;right:20px;background:#30283b;color:#fff;padding:14px 20px;border-radius:11px;font-size:12px}.navmobile{display:none}@media(max-width:680px){aside{display:none}main{padding:26px 15px 90px}h1{font-size:29px}.hero{padding:27px}.hero:after{right:-60px;opacity:.3}.toolbar{flex-direction:column}.toolbar input,.toolbar select{width:100%}.item{padding:10px 8px;gap:8px}.em{width:51px;height:53px;font-size:26px}.desc b{font-size:12px}.desc small{font-size:10px}.item button{padding:9px}.navmobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:2;padding:10px;justify-content:space-around;box-shadow:0 -4px 20px #0001}.navmobile button{border:0;background:none;padding:10px;color:#816baa}.sentiments{grid-template-columns:1fr}.modal{padding:20px}}
</style></head><body><div class="layout"><aside><strong>✳ palate lab.</strong><nav id="nav"></nav><p style="margin-top:70px">Beli 행동 관찰 기반<br>독립 구현 · 로컬 시연</p><button onclick="resetData()">↻ 데모 초기화</button></aside><main><header>PALATE LAB / <span id="where">탐색</span></header><div id="root"></div><div class="footnote">No real Beli API · Standalone quick demo served by FastAPI</div></main></div><div class="navmobile" id="mobile-nav"></div><div id="overlay"></div><div id="notices"></div><script>
let tab='discover',places=[],ranks=[],bookmarks=[],stats={},recs=[],category='All',query='',rankingCategory='All',chosenPlace=null,draft=null,selectedSentiment='liked',selectedCategory='Restaurants';
const categories=['All','Restaurants','Coffee & Tea','Bars','Bakeries','Ice Cream & Dessert'];
const labels={'All':'전체','Restaurants':'레스토랑','Coffee & Tea':'카페·티','Bars':'바','Bakeries':'베이커리','Ice Cream & Dessert':'디저트'};
const navs=[['discover','✳ 탐색'],['rankings','☰ 내 랭킹'],['recs','✦ 추천'],['saved','♡ 저장함']];
const el=id=>document.getElementById(id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,options){const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json'},...options});let j=await r.json();if(!r.ok)throw Error(j.detail||r.status);return j;}
const submit=(path,data)=>request(path,{method:'POST',body:data===undefined?undefined:JSON.stringify(data)});
function notify(s){el('notices').innerHTML=`<div class="notice">${escapeHTML(s)}</div>`;setTimeout(()=>el('notices').innerHTML='',2600);}
async function refresh(){try{[places,ranks,bookmarks,stats]=await Promise.all([request('/places'),request('/lists'),request('/bookmarks'),request('/stats')]);recs=(await request('/recommendations')).results;render();}catch(e){el('root').innerHTML=`<p>API 오류: ${escapeHTML(e.message)}</p>`;}}
function go(next){tab=next;render();window.scrollTo({top:0,behavior:'smooth'});}
function setCategory(s){category=s;render();}function setRankingCategory(s){rankingCategory=s;render();}
function listHTML(items,mode){if(!items.length)return '<div class="empty">해당하는 장소가 없습니다.</div>';return items.map((p,i)=>{const id=p.id;const source=places.find(x=>x.id===id)||p;const ranked=!!source.rank;const bk=!!source.bookmarked;let score=mode==='rankings'?Number(p.score).toFixed(1):mode==='recs'?Number(p.expected_percentile).toFixed(1):'★ '+p.average_score.toFixed(1);return `<div class="item">${mode==='rankings'?`<span class="ranknum">${String(i+1).padStart(2,'0')}</span>`:''}<span class="em">${p.icon}</span><div class="desc"><b>${escapeHTML(p.name)}</b><small>${escapeHTML(p.area)} · ${escapeHTML(labels[p.category]||p.category)}</small></div><span class="score">${score}</span><button class="${bk?'bookmarked':''}" onclick="bookmark(${id})" aria-label="북마크">${bk?'♥':'♡'}</button><button onclick="rank(${id})" ${ranked?'disabled':''}>${ranked?'✓':'+'}</button></div>`;}).join('');}
function filterHTML(selected,fn){return `<select onchange="${fn}(this.value)">${categories.map(c=>`<option value="${c}" ${c===selected?'selected':''}>${labels[c]}</option>`).join('')}</select>`;}
function render(){el('nav').innerHTML=navs.map(([id,l])=>`<button onclick="go('${id}')" class="${tab===id?'active':''}">${l}</button>`).join('');el('mobile-nav').innerHTML=navs.map(([id,l])=>`<button onclick="go('${id}')" style="color:${tab===id?'#684bb9':'#aaa'}">${l}</button>`).join('');el('where').textContent=Object.fromEntries(navs)[tab];let html='';
if(tab==='discover'){const found=places.filter(p=>(category==='All'||p.category===category)&&(`${p.name} ${p.area} ${p.cuisines.join(' ')}`).toLowerCase().includes(query.toLowerCase()));html=`<div class="hero"><header>YOUR TASTE, YOUR STORY</header><h1>먹고, 기억하고,<br><span>나만의 취향을 찾아요.</span></h1><p>새로운 공간을 발견하고, 나만의 순위를 만들어보세요.</p></div><h2>어디가 끌리나요?</h2><div class="toolbar"><input placeholder="장소 이름 또는 지역 검색" value="${escapeHTML(query)}" oninput="searchText(this.value)">${filterHTML(category,'setCategory')}</div><div class="box">${listHTML(found,tab)}</div>`;}
else if(tab==='rankings'){const filtered=rankingCategory==='All'?ranks:ranks.filter(x=>x.category===rankingCategory).sort((a,b)=>b.value-a.value);html=`<h1>내 랭킹 ✳</h1><p>직접 선택해서 만든 내 취향의 순서</p><div class="stats"><div>평가한 장소<b>${stats.count}</b></div><div>마일스톤<b>${stats.count>=10?'🏆':'🔒'}</b></div></div><div class="toolbar">${filterHTML(rankingCategory,'setRankingCategory')}</div><div class="box">${listHTML(filtered,tab)}</div>`;}
else if(tab==='recs'){html=`<h1>맞춤 추천 ✦</h1><p>내가 좋아한 장소와 비슷한 새로운 곳</p><div class="banner"><b>독립 추천 엔진</b><br>이 점수는 Beli 비공개 모델이 아닌, Python으로 작성한 예시 휴리스틱입니다.</div><div class="box">${listHTML(recs,tab)}</div>`;}
else {html=`<h1>가보고 싶은 곳 ♡</h1><p>나중에 방문하고 싶은 장소를 저장해보세요.</p><div class="box">${listHTML(bookmarks,tab)}</div>`;}
el('root').innerHTML=html;
}
function searchText(s){query=s;const pos=document.activeElement?.selectionStart;render();const input=document.querySelector('.toolbar input');if(input){input.focus();if(pos!=null)input.setSelectionRange(pos,pos);}}
async function bookmark(id){try{await submit('/bookmarks/'+id);await refresh();}catch(e){notify(e.message)}}
function rank(id){chosenPlace=places.find(p=>p.id===id);if(!chosenPlace||chosenPlace.rank)return;selectedSentiment='liked';selectedCategory=chosenPlace.category;showChoice()}
function closeModal(){el('overlay').innerHTML='';chosenPlace=null;draft=null;}
function modal(content){el('overlay').innerHTML=`<div class="modal-cover" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="head"><span style="font-size:11px;color:#947ab7;font-weight:bold">PALATE LAB</span><button onclick="closeModal()">✕</button></div>${content}</div></div>`;}
function showChoice(){modal(`<h2>${escapeHTML(chosenPlace.name)}<br>어땠나요?</h2><div class="controls"><label>카테고리</label><select id="rankCategory">${categories.slice(1).map(c=>`<option ${c===selectedCategory?'selected':''} value="${c}">${labels[c]}</option>`).join('')}</select><label>선호도</label><div class="sentiments">${[['liked','👍 좋았어요'],['fine','😐 괜찮았어요'],['disliked','👎 아쉬웠어요']].map(([v,l])=>`<button class="${selectedSentiment===v?'active':''}" onclick="chooseSentiment('${v}')">${l}</button>`).join('')}</div><button class="primary" onclick="startRank()">평가하고 순위에 넣기 →</button></div>`);}
function chooseSentiment(v){selectedSentiment=v;selectedCategory=el('rankCategory').value;showChoice()}
async function startRank(){selectedCategory=el('rankCategory').value;try{const response=await submit('/ranks',{place_id:chosenPlace.id,category:selectedCategory,sentiment:selectedSentiment});await next(response);}catch(e){notify(e.message)}}
async function next(r){if(r.status==='completed'){closeModal();await refresh();if(r.milestone_unlocked)showMilestone();else notify('내 랭킹에 반영했어요.');return;}draft=r;modal(`<h2>둘 중 어디가 더 좋았나요?</h2><p>비교를 통해 취향 순위가 결정됩니다.</p><div class="compare"><button onclick="decision('new')"><span>${r.place.icon}</span><b>${escapeHTML(r.place.name)}</b><small>새로 평가한 장소</small></button><button onclick="decision('existing')"><span>${r.compare_with.icon}</span><b>${escapeHTML(r.compare_with.name)}</b><small>기존 평가 장소</small></button></div><div class="minor-actions"><button onclick="decision('undo')" ${r.can_undo?'':'disabled'}>↶ 되돌리기</button><button onclick="decision('skip')">어려워요 · 건너뛰기 →</button></div>`);}
async function decision(choice){if(!draft)return;try{await next(await submit('/drafts/'+draft.draft_id+'/decision',{choice}));}catch(e){notify(e.message)}}
function showMilestone(){modal(`<div class="achievement"><div class="cup">🏆</div><p style="color:#7551a7;font-weight:800">MILESTONE UNLOCKED</p><h2>10개 평가 달성!</h2><p>취향 기록의 첫 번째 마일스톤을 달성했어요.</p><h1 style="color:#684bb9">10</h1><p>SPOTS RANKED</p><button class="primary" onclick="closeModal();go('rankings')">내 랭킹 보러가기 →</button></div>`)}
async function resetData(){if(!confirm('기본 9개 평가 상태로 초기화할까요?'))return;try{await submit('/demo/reset');closeModal();await refresh();notify('데모가 초기화됐어요.')}catch(e){notify(e.message)}}
refresh();
</script></body></html>
